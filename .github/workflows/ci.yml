name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: unittest (${{ matrix.python }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # system = /usr/bin/python3, the one launchd and SwiftBar run (macos/install.sh).
        python: [system, "3.x"]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.python != 'system'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests
        run: |
          PY=$([ "${{ matrix.python }}" = system ] && echo /usr/bin/python3 || echo python)
          "$PY" --version
          "$PY" -m unittest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .
